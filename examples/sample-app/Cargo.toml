[package]
name = "sample-app"
description = "Sample application demonstrating bootstrap, HTTP, and optional MySQL"
version = "0.0.0"
edition.workspace = true
publish = false

[package.metadata.askama]
dirs = ["templates"]

[lints]
workspace = true

[lib]
name = "sample_app"
path = "src/lib.rs"

[[bin]]
name = "sample-app"
path = "src/main.rs"

[dependencies]
askama = { workspace = true }
axum = { workspace = true }
rustbridge-core = { path = "../../crates/rustbridge-core" }
rustbridge-db = { path = "../../crates/rustbridge-db" }
rustbridge-http = { path = "../../crates/rustbridge-http" }
rustbridge-view = { path = "../../crates/rustbridge-view" }
sea-orm = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rustbridge-core = { path = "../../crates/rustbridge-core" }
rustbridge-db = { path = "../../crates/rustbridge-db" }
sample_app_migration = { path = "./migration", package = "sample-app-migration" }
sample_app = { path = ".", package = "sample-app" }
tokio = { workspace = true }
