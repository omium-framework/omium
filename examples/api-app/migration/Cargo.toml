[package]
name = "api-app-migration"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "api_app_migration"
path = "src/lib.rs"

[[bin]]
name = "omium-api-migrate"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
