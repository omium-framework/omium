[package]
name = "react-inertia-app-migration"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "react_inertia_app_migration"
path = "src/lib.rs"

[[bin]]
name = "inertia-react-migrate"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
omium-core = { path = "../../../crates/omium-core" }
omium-db = { path = "../../../crates/omium-db" }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
