[package]
name = "omium-inertia"
description = "Inertia protocol integration for Vue/React modes"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "omium_inertia"

[features]
default = ["inertia-rs"]
inertia-rs = ["dep:inertia_rs"]

[dependencies]
axum = { workspace = true }
inertia_rs = { version = "0.4.0", optional = true, default-features = false, features = [
    "axum",
] }
omium-core = { path = "../omium-core", version = "0.1.5" }
omium-view = { package = "omium-view", path = "../omium-view", version = "0.1.5" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
