[session]
driver = "file"
cookie = "omium_session"
lifetime_minutes = 120
file_path = "storage/framework/sessions"

[csrf]
enabled = true

[demo]
enabled = true
email = "admin@omium.local"
# Local development only — override with APP_AUTH__DEMO_PASSWORD in .env
password = "omium-dev"

[api]
enabled = true
demo_token = "omium-dev-api-token"
demo_user_id = 1

