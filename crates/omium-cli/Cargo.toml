[package]
name = "omium-cli"
description = "CLI library, project generator, and development commands (omnisan binary)"
version = "0.1.11"
edition.workspace = true
publish = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "omium_cli"

[[bin]]
name = "omnisan"
path = "src/bin/omnisan.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
omium-core = { path = "../omium-core", version = "0.1.5" }
omium-db = { path = "../omium-db", version = "0.1.5" }
omium-http = { path = "../omium-http", version = "0.1.5" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "net", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
