<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Page{% endblock %} — {{ app_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
    table { border-collapse: collapse; width: 100%; max-width: 48rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; }
    .field-error { color: #b00020; font-size: 0.875rem; margin: 0.25rem 0 0; }
    .form-error { background: #fdecea; border: 1px solid #f5c6cb; padding: 0.75rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-top: 0.75rem; }
    input[type="text"] { width: 100%; max-width: 24rem; padding: 0.5rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/examples/new">New example</a>
    <a href="/health">Health JSON</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
