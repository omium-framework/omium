[workspace]
resolver = "2"
members = [
    "crates/omium-auth",
    "crates/omium-cli",
    "crates/omium-core",
    "crates/omium-db",
    "crates/omium-http",
    "crates/omium-inertia",
    "crates/omium-testing",
    "crates/omium-view",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
publish = false
authors = ["Orhan MUSELLİM <info@orhanmusellim.com>"]
license = "MIT"
repository = "https://github.com/omium-framework"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Baseline inventory (D-006–D-015). Crates adopt these in later phases.
[workspace.dependencies]
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
askama = "0.14.0"
axum = "0.8.8"
clap = { version = "4.5.53", features = ["derive"] }
sea-orm = { version = "1.1.19", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "with-chrono",
] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
] }
thiserror = "2.0.17"
dotenvy = "0.15.7"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8.23"
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tempfile = "3.24.0"
assert_cmd = "2.1.1"
predicates = "3.1.4"
password-hash = "0.5.0"
